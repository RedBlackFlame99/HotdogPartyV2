<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRO Game Library</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1f 100%);
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px 30px;
      text-align: center;
      background: linear-gradient(180deg, rgba(30, 20, 40, 0.95) 0%, rgba(20, 15, 30, 0.8) 100%);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.2);
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 25px;
      text-shadow: 0 0 40px rgba(168, 85, 247, 0.5);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
      }
      to {
        filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.8));
      }
    }

    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 16px 24px;
      border-radius: 50px;
      border: 2px solid rgba(168, 85, 247, 0.4);
      background: rgba(30, 20, 40, 0.6);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    input:focus {
      border-color: #a855f7;
      background: rgba(30, 20, 40, 0.9);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 25px;
      padding: 40px 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .game {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid rgba(168, 85, 247, 0.3);
      background: linear-gradient(135deg, rgba(40, 30, 50, 0.8), rgba(30, 20, 40, 0.8));
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .game:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: #a855f7;
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.4), 0 0 40px rgba(168, 85, 247, 0.2);
    }

    .game img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .game:hover img {
      transform: scale(1.1);
    }

    .game::after {
      content: attr(data-name);
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      background: linear-gradient(to top, rgba(10, 5, 15, 0.95), rgba(10, 5, 15, 0.7));
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 12px;
      backdrop-filter: blur(4px);
    }

    .game:hover::after {
      opacity: 1;
    }

    .menu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(30, 20, 45, 0.98), rgba(20, 15, 35, 0.98));
      padding: 25px;
      border-radius: 20px;
      display: none;
      min-width: 280px;
      z-index: 1001;
      border: 2px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 10px 50px rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(20px);
    }

    .menu h3 {
      margin-bottom: 20px;
      font-size: 22px;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .menu button {
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      border: 2px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      cursor: pointer;
      background: rgba(40, 30, 50, 0.6);
      color: white;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .menu button:hover {
      background: rgba(168, 85, 247, 0.3);
      border-color: #a855f7;
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 36px;
        letter-spacing: 6px;
      }

      .container {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 15px;
        padding: 25px 15px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">ASTRO</div>
  <div class="search-container">
    <input type="text" id="search" placeholder="Search your library..." onkeyup="filterGames()" />
  </div>
</header>

<div class="container" id="gameList"></div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="menu" id="menu"></div>

<script>
let games = [];

async function loadGames() {
  try {
    const res = await fetch('games.json');
    games = await res.json();
    renderGames(games);
  } catch (err) {
    console.error('Failed to load games.json', err);
  }
}

function renderGames(list) {
  const container = document.getElementById('gameList');
  container.innerHTML = '';

  list.forEach(game => {
    const div = document.createElement('div');
    div.className = 'game';
    div.setAttribute('data-name', game.name);

    div.innerHTML = `<img src="${game.icon}" alt="${game.name}" />`;

    div.onclick = () => openGame(game);

    container.appendChild(div);
  });
}

function openGame(game) {
  if (!game.paths || game.paths.length === 0) return;

  if (game.paths.length === 1) {
    window.location.href = game.paths[0].path;
    return;
  }

  openMenu(game);
}

function openMenu(game) {
  const menu = document.getElementById('menu');
  const overlay = document.getElementById('overlay');

  menu.innerHTML = `<h3>${game.name}</h3>`;

  game.paths.forEach(p => {
    const btn = document.createElement('button');
    btn.innerText = p.name;
    btn.onclick = () => window.location.href = p.path;
    menu.appendChild(btn);
  });

  overlay.style.display = 'block';
  menu.style.display = 'block';
}

function closeMenu() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('menu').style.display = 'none';
}

function filterGames() {
  const input = document.getElementById('search').value.toLowerCase();
  const filtered = games.filter(g => g.name.toLowerCase().includes(input));
  renderGames(filtered);
}

loadGames();
</script>

</body>
</html>
