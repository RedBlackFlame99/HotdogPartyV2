<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRO Game Library</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: linear-gradient(135deg, #0a0515 0%, #0f0a1f 25%, #0d0820 50%, #0a0a1a 75%, #050510 100%);
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(30, 15, 60, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(20, 10, 50, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(25, 15, 55, 0.35) 0%, transparent 50%);
      animation: bgPulse 15s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -50px) scale(1.1); }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.8), transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(1);
        opacity: 0;
      }
    }

    /* Grid lines */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: transparent;
      position: relative;
      z-index: 100;
      border-bottom: 3px solid rgba(168, 85, 247, 0.3);
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
    }

    .logo {
      font-size: 96px;
      font-weight: 900;
      letter-spacing: 20px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 25%, #8b5cf6 50%, #a855f7 75%, #ec4899 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 35px;
      animation: gradientShift 3s ease infinite, glow 2s ease-in-out infinite alternate, pulse 2s ease-in-out infinite;
      position: relative;
      display: inline-block;
      filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.8));
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6)) drop-shadow(0 0 40px rgba(236, 72, 153, 0.4));
      }
      to {
        filter: drop-shadow(0 0 40px rgba(168, 85, 247, 1)) drop-shadow(0 0 60px rgba(236, 72, 153, 0.6));
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .logo::before {
      content: 'ASTRO';
      position: absolute;
      left: 0;
      top: 0;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(20px);
      opacity: 0.7;
      z-index: -1;
    }

    .search-container {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 18px 28px;
      border-radius: 50px;
      border: 2px solid rgba(168, 85, 247, 0.5);
      background: rgba(20, 10, 30, 0.5);
      color: #fff;
      font-size: 17px;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.2);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      border-color: #a855f7;
      background: rgba(30, 20, 40, 0.7);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5), 0 0 60px rgba(236, 72, 153, 0.3);
      transform: scale(1.02);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 30px;
      padding: 50px 40px;
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    .game {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 3px solid rgba(168, 85, 247, 0.4);
      background: linear-gradient(135deg, rgba(40, 30, 50, 0.7), rgba(30, 20, 40, 0.7));
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.2);
      backdrop-filter: blur(10px);
    }

    .game::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(168, 85, 247, 0.3), transparent);
      transform: rotate(45deg);
      transition: all 0.5s;
    }

    .game:hover::before {
      animation: shine 1.5s ease-in-out infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .game:hover {
      transform: translateY(-12px) scale(1.05) rotate(2deg);
      border-color: #ec4899;
      box-shadow: 
        0 15px 45px rgba(168, 85, 247, 0.5), 
        0 0 60px rgba(236, 72, 153, 0.4),
        0 0 100px rgba(168, 85, 247, 0.3);
    }

    .game img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .game:hover img {
      transform: scale(1.15);
    }

    .game::after {
      content: attr(data-name);
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(to top, rgba(10, 5, 15, 0.98), rgba(10, 5, 15, 0.8));
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 15px;
      backdrop-filter: blur(8px);
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
    }

    .game:hover::after {
      opacity: 1;
    }

    .menu {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: linear-gradient(135deg, rgba(30, 20, 45, 0.95), rgba(20, 15, 35, 0.95));
      padding: 30px;
      border-radius: 25px;
      display: none;
      min-width: 320px;
      z-index: 1001;
      border: 3px solid rgba(168, 85, 247, 0.6);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.8),
        0 0 100px rgba(168, 85, 247, 0.4),
        inset 0 0 50px rgba(168, 85, 247, 0.1);
      backdrop-filter: blur(30px);
      animation: menuPop 0.3s ease forwards;
    }

    @keyframes menuPop {
      to { transform: translate(-50%, -50%) scale(1); }
    }

    .menu h3 {
      margin-bottom: 25px;
      font-size: 26px;
      text-align: center;
      background: linear-gradient(135deg, #a855f7, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
      text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    .menu button {
      width: 100%;
      margin: 10px 0;
      padding: 16px;
      border: 2px solid rgba(168, 85, 247, 0.4);
      border-radius: 15px;
      cursor: pointer;
      background: rgba(40, 30, 50, 0.7);
      color: white;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .menu button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .menu button:hover::before {
      width: 300px;
      height: 300px;
    }

    .menu button:hover {
      background: rgba(168, 85, 247, 0.4);
      border-color: #ec4899;
      transform: translateX(8px);
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.4);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 56px;
        letter-spacing: 12px;
      }

      .container {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 20px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<div class="bg-animation"></div>
<div class="grid-bg"></div>

<header>
  <div class="logo">ASTRO</div>
  <div class="search-container">
    <input type="text" id="search" placeholder="🔍 Search your library..." onkeyup="filterGames()" />
  </div>
</header>

<div class="container" id="gameList"></div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="menu" id="menu"></div>

<script>
// Create floating particles
function createParticles() {
  const particleContainer = document.querySelector('.bg-animation');
  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.width = Math.random() * 5 + 2 + 'px';
    particle.style.height = particle.style.width;
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDuration = Math.random() * 8 + 8 + 's';
    particle.style.animationDelay = Math.random() * 8 + 's';
    particleContainer.appendChild(particle);
  }
}

createParticles();

let games = [];

async function loadGames() {
  try {
    const res = await fetch('games.json');
    games = await res.json();
    renderGames(games);
  } catch (err) {
    console.error('Failed to load games.json', err);
  }
}

function renderGames(list) {
  const container = document.getElementById('gameList');
  container.innerHTML = '';

  list.forEach(game => {
    const div = document.createElement('div');
    div.className = 'game';
    div.setAttribute('data-name', game.name);

    div.innerHTML = `<img src="${game.icon}" alt="${game.name}" />`;

    div.onclick = () => openGame(game);

    container.appendChild(div);
  });
}

function openGame(game) {
  if (!game.paths || game.paths.length === 0) return;

  if (game.paths.length === 1) {
    window.location.href = game.paths[0].path;
    return;
  }

  openMenu(game);
}

function openMenu(game) {
  const menu = document.getElementById('menu');
  const overlay = document.getElementById('overlay');

  menu.innerHTML = `<h3>${game.name}</h3>`;

  game.paths.forEach(p => {
    const btn = document.createElement('button');
    btn.innerText = p.name;
    btn.onclick = () => window.location.href = p.path;
    menu.appendChild(btn);
  });

  overlay.style.display = 'block';
  menu.style.display = 'block';
}

function closeMenu() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('menu').style.display = 'none';
}

function filterGames() {
  const input = document.getElementById('search').value.toLowerCase();
  const filtered = games.filter(g => g.name.toLowerCase().includes(input));
  renderGames(filtered);
}

loadGames();
</script>

</body>
</html>
